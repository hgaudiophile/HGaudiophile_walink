<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HG Audiophile</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #fff;
  }
  .loader {
    text-align: center;
  }
  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid #333;
    border-top: 3px solid #25D366;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  p {
    font-size: 14px;
    color: #aaa;
  }
</style>
</head>
<body>

<div class="loader">
  <div class="spinner"></div>
  <p>Menghubungkan ke WhatsApp...</p>
</div>

<!-- Meta Pixel Code -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');

// GANTI dengan Pixel ID kamu dari Meta Events Manager
fbq('init', '597287352852502');
fbq('track', 'PageView');
fbq('track', 'Contact'); // menandakan orang klik untuk kontak via WA
</script>
<!-- End Meta Pixel Code -->

<script>
  // GANTI nomor WA dan pesan default sesuai kebutuhan
  const waNumber = "6287852292000"; // ganti dengan nomor WA bisnis kamu (format 62xxx tanpa +)
  const waMessage = "Halo, saya konsultasikan mobil saya";
  const waUrl = "https://wa.me/" + waNumber + "?text=" + encodeURIComponent(waMessage);

  // Redirect otomatis setelah pixel sempat fire (800ms)
  setTimeout(function() {
    window.location.href = waUrl;
  }, 800);
</script>

</body>
</html>
